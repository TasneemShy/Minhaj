spring.application.name=Minhaj
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/minhaj_db
spring.datasource.username=tasneem
spring.datasource.password=

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate

# Databases created before Flyway (built by the old ddl-auto=update: the local minhaj_db, the Docker volume)
# already have the V1 schema but no flyway_schema_history table. baseline-on-migrate makes Flyway record
# them as "baselined at V1" and skip V1__baseline.sql instead of failing on a non-empty schema.
# Brand-new empty databases are not affected: Flyway runs V1 (and later migrations) normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}
# Access tokens (JWTs) are stateless and cannot be revoked, so they are short-lived; clients renew them with
# POST /api/auth/refresh. Refresh tokens are stored (hashed), single-use and revoked on logout or password change.
app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}

# CORS: comma-separated list of exact browser origins allowed to call the API. "*" is rejected at startup.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Base URL of the frontend; emails link to <frontend-url>/reset-password?token=... and /verify-email?token=...
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Rate limits on the public auth endpoints (in-memory token buckets, per app instance). Each limit is
# "requests per window", refilled gradually. Over the limit -> 429 Problem Details with a Retry-After header.
app.rate-limit.enabled=true
app.rate-limit.window=1m
# POST /api/auth/login per email + client IP, and per client IP across all emails
app.rate-limit.login-per-email=5
app.rate-limit.login-per-ip=20
# POST /api/auth/register, /forgot-password, /reset-password and /resend-verification, per client IP and endpoint
app.rate-limit.per-ip=10
# Upper bound on buckets kept in memory; idle ones are dropped after one window
app.rate-limit.max-tracked-keys=100000
# The client IP is request.getRemoteAddr(). X-Forwarded-For is ignored by default because any client can set it
# and would get a fresh limit per request. Only turn this on behind exactly one reverse proxy that overwrites
# the header; the right-most entry is then used. (Or set server.forward-headers-strategy=native instead.)
app.rate-limit.trust-forwarded-for=false

# Actuator: only health and info are exposed over HTTP; every other endpoint stays off the web.
management.endpoints.web.exposure.include=health,info
# /actuator/health/liveness and /actuator/health/readiness (used by the Docker healthcheck).
management.endpoint.health.probes.enabled=true
# Readiness also requires the database to be reachable.
management.endpoint.health.group.readiness.include=readinessState,db
# Anonymous callers only see {"status":"UP"}; ADMIN users see the individual components and details.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
# Email is best-effort: a Mailtrap outage or rate limit must not mark the app DOWN.
management.health.mail.enabled=false

# /actuator/info: the "app" block comes from these info.* properties (Maven fills in @...@ at build time),
# the "build" block from build-info.properties written by spring-boot-maven-plugin.
management.info.env.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# OpenAPI: error responses are documented per operation in the controllers, so springdoc should not
# attach GlobalExceptionHandler's responses to every endpoint. Success bodies are JSON unless stated otherwise.
springdoc.override-with-generic-response=false
springdoc.default-produces-media-type=application/json
