# Test profile: everything needed to start the app without a .env file.
# The datasource comes from the Testcontainers @ServiceConnection, not from these properties.

# Test-only HMAC key (base64, 256 bit); never used outside tests
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLW1pbmhhai10ZXN0cw==

# JavaMailSender is replaced by a Mockito mock in the tests; these only satisfy the placeholders
spring.mail.host=localhost
spring.mail.username=test
spring.mail.password=test

spring.jpa.show-sql=false

# Trailing slash on purpose: reset links must not get a double slash
app.frontend-url=https://app.minhaj.test/
