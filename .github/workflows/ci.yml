name: Minhaj CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test report check run

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Integration tests start their own Postgres with Testcontainers (Docker is available on
      # ubuntu-latest), and the JWT secret / mail settings come from src/test/resources/application-test.properties.
      - name: Build and Test with Maven
        run: ./mvnw -B clean verify -Pintegration

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          # Fork PRs get a read-only token, so annotate instead of creating a check run
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: minhaj-jar
          path: target/*.jar
          if-no-files-found: error

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The multi-stage Dockerfile compiles the jar itself, so no JDK setup is needed here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: minhaj-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
