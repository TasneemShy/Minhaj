name: Minhaj CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test report check run

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: minhaj_db
          POSTGRES_USER: minhaj_user
          POSTGRES_PASSWORD: minhaj_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw -B clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/minhaj_db
          SPRING_DATASOURCE_USERNAME: minhaj_user
          SPRING_DATASOURCE_PASSWORD: minhaj_password
          # Test-only signing key; not used anywhere else
          JWT_SECRET: 6HXvmaRrAQl5/BxCsO9S/W2OXRhp28AAtl/3h+43d30=

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          # Fork PRs get a read-only token, so annotate instead of creating a check run
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: minhaj-jar
          path: target/*.jar
          if-no-files-found: error

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The multi-stage Dockerfile compiles the jar itself, so no JDK setup is needed here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: minhaj-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
