services:
  db:
    image: postgres:15-alpine
    container_name: minhaj-db
    environment:
      POSTGRES_DB: minhaj_db
      POSTGRES_USER: tasneem
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - minhaj_new_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasneem -d minhaj_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: minhaj-backend:latest
    container_name: minhaj-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/minhaj_db
      - SPRING_DATASOURCE_USERNAME=tasneem
      - SPRING_DATASOURCE_PASSWORD=root
      # JSON (ECS) console logs for log shippers; METRICS_TOKEN itself comes from .env
      - LOG_FORMAT=json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine runtime image; readiness includes the database check.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  minhaj_new_postgres_data: